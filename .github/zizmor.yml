# zizmor (security.yml → workflows) settings. Every ignore needs a reason.
rules:
  cache-poisoning:
    ignore:
      # Release builds restore the `dist-<target>` Rust cache that only
      # cache-warm.yml writes, on pushes to main. Pull requests write to their
      # own cache scope and can't reach it, so poisoning it takes code already
      # merged to main. Building every dependency from scratch on each tag is
      # the alternative.
      - release.yml
  dangerous-triggers:
    ignore:
      # `/take` and `/drop` need a token that can assign issues, which only
      # `issue_comment` gives. The job never checks out or runs code, the
      # comment reaches the script only through environment variables, and
      # its token can write issues and nothing else.
      - issue-claims.yml
      # `/solve` merges a pull request with the owner's token (`SOLVE_TOKEN`),
      # and only `issue_comment` reaches fork PRs with secrets. Every job
      # checks out the default branch, never the PR, runs only main's
      # solvers.py, and the comment and inputs reach it only through
      # environment variables. The merge is pinned to the approved commit.
      - solvers.yml
