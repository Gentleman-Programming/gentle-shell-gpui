[package]
name = "gentle-term-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Terminals that outlive their clients, for a Gentle Shell server
# (`gentle-shell serve`): see src/main.rs. Unix sockets on Unix, loopback TCP
# with a token everywhere (the only transport on Windows).
[[bin]]
name = "gentle-term-host"
path = "src/main.rs"

[dependencies]
# PTYs (ConPTY on Windows), and the headless emulator a reattaching client's
# snapshot is drawn from. The version the app already locks.
alacritty_terminal = "0.26"
# Terminal data on the protocol. The version the app already locks.
base64 = "0.23"
serde_json.workspace = true
# The PTY's I/O loop (what alacritty_terminal's own loop polls with). The
# version alacritty_terminal already locks.
polling = "3"

[target.'cfg(unix)'.dependencies]
# Signals, umask and the passwd shell. The version alacritty_terminal
# already locks.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Ending a ConPTY's program, the token file's owner-only DACL and the
# system RNG. The version alacritty_terminal already locks.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }
