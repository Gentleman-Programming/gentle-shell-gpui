[package]
name = "pi-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
dunce = "1"
serde.workspace = true
serde_json.workspace = true
which = "8"

# Windows: the neutral folder children start in (the user's profile, read
# from the shell rather than an environment variable a child may override),
# and the Job Object that ends children with the app.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
pollster = "1.0"
