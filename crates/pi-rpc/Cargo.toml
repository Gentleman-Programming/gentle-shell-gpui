[package]
name = "pi-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
# File contents, git output and terminal bytes on a Gentle Shell server's
# API. The version the app already locks.
base64 = "0.23"
dunce = "1"
# A Gentle Shell server's protocol rules (`gentle_core::serve`).
gentle-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
# The terminal host binary's hash, as `PUT /api/term-host` checks it. The
# version the app already locks.
sha2 = "0.11"
# A Gentle Shell server's session (`serve`): plain HTTP and its event stream.
# The version the app already locks; TLS is the app's (servers speak HTTP).
ureq = { version = "3", default-features = false }
which = "8"

# Windows: the neutral folder children start in (the user's profile, read
# from the shell rather than an environment variable a child may override),
# and the Job Object that ends children with the app.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
pollster = "1.0"
